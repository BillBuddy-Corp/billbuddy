spring:
  datasource:
    url: jdbc:h2:mem:billbuddy-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false

  mail:
    host: localhost
    port: 3025
    username: test@example.com
    password: test-password
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

jwt:
  secret: test-only-secret-key-not-used-outside-the-test-suite-min-256-bits
  access-token-expiry-minutes: 15
  refresh-token-expiry-days: 30

google:
  client-id: test-client-id-not-used-by-mocked-verifier

invite:
  email-expiry-days: 7

auth-token:
  password-reset-expiry-minutes: 60
  email-verification-expiry-hours: 24
  email-change-expiry-minutes: 60

otp:
  expiry-minutes: 10
  max-attempts: 5

gemini:
  api-key: unused
  model: gemini-3.8-flash

claude:
  api-key: test-key-not-used-by-mocked-scanner
  model: claude-haiku-4-5-20251001
  workspace-id:

app:
  join-link-base-url: billbuddy://join-group
  reset-password-base-url: billbuddy://reset-password
  verify-email-base-url: billbuddy://verify-email
  email-change-base-url: http://localhost:3000/auth/confirm-email-change
  upload-dir: ./target/test-uploads
