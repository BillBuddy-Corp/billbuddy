spring:
  application:
    name: backend

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

jwt:
  secret: ${JWT_SECRET}
  access-token-expiry-minutes: ${JWT_EXPIRATION_MINUTES}
  refresh-token-expiry-days: ${JWT_REFRESH_TOKEN_EXPIRY_DAYS}

invite:
  email-expiry-days: ${INVITE_EMAIL_EXPIRY_DAYS:7}

app:
  join-link-base-url: ${JOIN_LINK_BASE_URL:http://localhost:3000/invites/join}
  upload-dir: ${UPLOAD_DIR:/app/uploads}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    tags-sorter: alpha
    operations-sorter: alpha
  show-actuator: true