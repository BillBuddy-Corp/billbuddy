spring:
  application:
    name: backend

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

jwt:
  secret: ${JWT_SECRET}
  access-token-expiry-minutes: ${JWT_EXPIRATION_MINUTES}
  refresh-token-expiry-days: ${JWT_REFRESH_TOKEN_EXPIRY_DAYS}

invite:
  email-expiry-days: ${INVITE_EMAIL_EXPIRY_DAYS:7}

auth-token:
  password-reset-expiry-minutes: ${PASSWORD_RESET_EXPIRY_MINUTES:60}
  email-verification-expiry-hours: ${EMAIL_VERIFICATION_EXPIRY_HOURS:24}

app:
  join-link-base-url: ${JOIN_LINK_BASE_URL:http://localhost:3000/invites/join}
  reset-password-base-url: ${RESET_PASSWORD_BASE_URL:http://localhost:3000/auth/reset-password}
  verify-email-base-url: ${VERIFY_EMAIL_BASE_URL:http://localhost:3000/auth/verify-email}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    tags-sorter: alpha
    operations-sorter: alpha
  show-actuator: true