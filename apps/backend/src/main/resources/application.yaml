spring:
  application:
    name: backend

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

jwt:
  secret: ${JWT_SECRET}
  access-token-expiry-minutes: ${JWT_EXPIRATION_MINUTES}
  refresh-token-expiry-days: ${JWT_REFRESH_TOKEN_EXPIRY_DAYS}

google:
  client-id: ${GOOGLE_CLIENT_ID}

invite:
  email-expiry-days: ${INVITE_EMAIL_EXPIRY_DAYS:7}

auth-token:
  password-reset-expiry-minutes: ${PASSWORD_RESET_EXPIRY_MINUTES:60}
  email-verification-expiry-hours: ${EMAIL_VERIFICATION_EXPIRY_HOURS:24}
  email-change-expiry-minutes: ${EMAIL_CHANGE_EXPIRY_MINUTES:60}

otp:
  expiry-minutes: ${OTP_EXPIRY_MINUTES:10}
  max-attempts: ${OTP_MAX_ATTEMPTS:5}

gemini:
  api-key: ${GEMINI_API_KEY:unused}
  model: ${GEMINI_MODEL:gemini-3.8-flash}

claude:
  api-key: ${ANTHROPIC_API_KEY}
  model: ${CLAUDE_MODEL:claude-sonnet-5}
  workspace-id: ${ANTHROPIC_WORKSPACE_ID:}

fx:
  base-url: ${FX_API_BASE_URL:https://api.frankfurter.dev/v1}

app:
  join-link-base-url: ${JOIN_LINK_BASE_URL:http://localhost:3000/invites/join}
  reset-password-base-url: ${RESET_PASSWORD_BASE_URL:billbuddy://reset-password}
  verify-email-base-url: ${VERIFY_EMAIL_BASE_URL:billbuddy://verify-email}
  email-change-base-url: ${EMAIL_CHANGE_BASE_URL:http://localhost:3000/auth/confirm-email-change}
  upload-dir: ${UPLOAD_DIR:/app/uploads}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    tags-sorter: alpha
    operations-sorter: alpha
  show-actuator: true